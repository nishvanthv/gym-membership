<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gym Management System | Member</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand">Gym Management System</span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="container pb-5">
    <div id="pageAlert" class="alert alert-custom"></div>
    <div class="row g-3">
      <div class="col-md-4"><div class="card p-3"><h5>Profile</h5><div id="profile"></div></div></div>
      <div class="col-md-4"><div class="card p-3"><h5>Membership</h5><div id="membership"></div></div></div>
      <div class="col-md-4"><div class="card p-3"><h5>Notifications</h5><div id="notesN"></div></div></div>
    </div>
    <div class="card p-3 mt-3">
      <h5>Purchase / Renew</h5>
      <div class="d-flex gap-2">
        <select class="form-select" id="planSelect"></select>
        <button class="btn btn-success" onclick="purchase()">Purchase</button>
        <button class="btn btn-outline-success" onclick="renew()">Renew</button>
      </div>
    </div>
    <div class="card p-3 mt-3">
      <h5>Available Classes</h5>
      <div id="classes"></div>
    </div>
    <div class="card p-3 mt-3">
      <h5>My Bookings</h5>
      <div id="bookings"></div>
    </div>
    <div class="row g-3 mt-1">
      <div class="col-md-6"><div class="card p-3"><h5>Attendance</h5><div id="attendance"></div></div></div>
      <div class="col-md-6"><div class="card p-3"><h5>Workout / Diet Notes</h5><div id="notes"></div></div></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const user = requireRole(['MEMBER']);
    let currentMembershipId = null;

    async function load() {
      const dash = await api('/member/dashboard');
      const d = dash.data;
      document.getElementById('profile').innerHTML = `<p>${d.profile.name}<br>${d.profile.email}</p>`;
      document.getElementById('membership').innerHTML = d.currentMembership
        ? `<p>Status: ${d.currentMembership.status}<br>Expires: ${new Date(d.currentMembership.endDate).toLocaleString()}</p>`
        : '<p>No active membership</p>';
      currentMembershipId = d.currentMembership ? d.currentMembership._id : null;
      document.getElementById('notesN').innerHTML = d.notifications.map((n) => `<div>${n.title}: ${n.message}</div>`).join('') || 'None';
      document.getElementById('classes').innerHTML = d.availableClasses.map((c) =>
        `<div class="d-flex justify-content-between border-bottom py-2"><span>${c.title} (${c.bookedCount}/${c.capacity}) ${new Date(c.startTime).toLocaleString()}</span><button class="btn btn-sm btn-success" onclick="book('${c._id}')">Book</button></div>`
      ).join('') || 'No upcoming classes';
      document.getElementById('bookings').innerHTML = [...d.upcomingBookings, ...d.waitlistedClasses].map((b) =>
        `<div class="d-flex justify-content-between border-bottom py-2"><span>${b.classId ? b.classId.title : ''} | ${b.status}</span><span><button class="btn btn-sm btn-outline-success" onclick="checkin('${b.classId._id}')">Check in</button> <button class="btn btn-sm btn-danger" onclick="cancel('${b._id}')">Cancel</button></span></div>`
      ).join('') || 'No bookings';
      document.getElementById('attendance').innerHTML = d.attendanceHistory.map((a) => `<div>${a.type} ${new Date(a.date).toLocaleString()}</div>`).join('') || 'None';
      document.getElementById('notes').innerHTML = d.notes.map((n) => `<div><strong>${n.type}</strong> ${n.title}: ${n.content}</div>`).join('') || 'None';

      const plans = await api('/plans');
      document.getElementById('planSelect').innerHTML = plans.data.map((p) => `<option value="${p._id}">${p.name} | ${p.durationMonths} month(s) | ${p.price}</option>`).join('');
    }

    async function purchase() {
      try {
        await api('/memberships', { method: 'POST', body: JSON.stringify({ planId: document.getElementById('planSelect').value }) });
        showAlert('pageAlert', 'Membership purchased', true);
        load();
      } catch (err) { showAlert('pageAlert', err.message); }
    }
    async function renew() {
      if (!currentMembershipId) return showAlert('pageAlert', 'No membership to renew');
      try {
        await api('/memberships/' + currentMembershipId + '/renew', { method: 'POST', body: JSON.stringify({ planId: document.getElementById('planSelect').value }) });
        showAlert('pageAlert', 'Membership renewed', true);
        load();
      } catch (err) { showAlert('pageAlert', err.message); }
    }
    async function book(id) {
      try {
        const res = await api('/classes/' + id + '/book', { method: 'POST' });
        showAlert('pageAlert', res.message, true);
        load();
      } catch (err) { showAlert('pageAlert', err.message); }
    }
    async function cancel(id) {
      try {
        await api('/bookings/' + id + '/cancel', { method: 'POST' });
        showAlert('pageAlert', 'Booking cancelled', true);
        load();
      } catch (err) { showAlert('pageAlert', err.message); }
    }
    async function checkin(classId) {
      try {
        await api('/attendance/checkin', { method: 'POST', body: JSON.stringify({ type: 'CLASS', classId }) });
        showAlert('pageAlert', 'Checked in', true);
        load();
      } catch (err) { showAlert('pageAlert', err.message); }
    }
    load().catch((err) => showAlert('pageAlert', err.message));
  </script>
</body>
</html>
