<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gym Management System | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand">Gym Management System</span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="container pb-5">
    <div id="pageAlert" class="alert alert-custom"></div>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="card p-3">
          <h5>Create Membership Plan</h5>
          <input class="form-control mb-2" id="planName" placeholder="Name" />
          <input class="form-control mb-2" id="planDuration" type="number" placeholder="Duration months" />
          <input class="form-control mb-2" id="planPrice" type="number" placeholder="Price" />
          <input class="form-control mb-2" id="planDesc" placeholder="Description" />
          <button class="btn btn-success" onclick="createPlan()">Save plan</button>
          <div id="plans" class="mt-3"></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h5>Create Trainer</h5>
          <input class="form-control mb-2" id="tName" placeholder="Name" />
          <input class="form-control mb-2" id="tEmail" placeholder="Email" />
          <input class="form-control mb-2" id="tPassword" placeholder="Password" />
          <input class="form-control mb-2" id="tSpec" placeholder="Specialization" />
          <button class="btn btn-success" onclick="createTrainer()">Save trainer</button>
          <div id="trainers" class="mt-3"></div>
        </div>
      </div>
    </div>
    <div class="card p-3 mt-3">
      <h5>Create Class</h5>
      <div class="row g-2">
        <div class="col-md-3"><input class="form-control" id="cTitle" placeholder="Title" /></div>
        <div class="col-md-3"><select class="form-select" id="cTrainer"></select></div>
        <div class="col-md-2"><input class="form-control" id="cCapacity" type="number" placeholder="Capacity" /></div>
        <div class="col-md-2"><input class="form-control" id="cStart" type="datetime-local" /></div>
        <div class="col-md-2"><input class="form-control" id="cEnd" type="datetime-local" /></div>
      </div>
      <button class="btn btn-success mt-2" onclick="createClass()">Save class</button>
      <div id="classes" class="mt-3"></div>
    </div>
    <div class="row g-3 mt-1">
      <div class="col-md-6"><div class="card p-3"><h5>Attendance Report</h5><button class="btn btn-outline-success mb-2" onclick="loadAttendance()">Refresh</button><pre id="attReport"></pre></div></div>
      <div class="col-md-6"><div class="card p-3"><h5>Membership Report</h5><button class="btn btn-outline-success mb-2" onclick="loadMemberships()">Refresh</button><pre id="memReport"></pre></div></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    requireRole(['BRANCH_ADMIN']);
    async function load() {
      const [plans, trainers, classes] = await Promise.all([api('/plans'), api('/trainers'), api('/classes')]);
      document.getElementById('plans').innerHTML = plans.data.map((p) => `<div>${p.name} | ${p.durationMonths}m | ${p.price} (${p.isActive ? 'active' : 'inactive'})</div>`).join('');
      document.getElementById('trainers').innerHTML = trainers.data.map((t) => `<div>${t.userId.name} | ${t.specialization}</div>`).join('');
      document.getElementById('cTrainer').innerHTML = trainers.data.map((t) => `<option value="${t.userId._id}">${t.userId.name}</option>`).join('');
      document.getElementById('classes').innerHTML = classes.data.map((c) => `<div>${c.title} | ${c.status} | ${c.bookedCount}/${c.capacity}</div>`).join('');
    }
    async function createPlan() {
      try {
        await api('/plans', { method: 'POST', body: JSON.stringify({
          name: document.getElementById('planName').value,
          durationMonths: Number(document.getElementById('planDuration').value),
          price: Number(document.getElementById('planPrice').value),
          description: document.getElementById('planDesc').value
        })});
        showAlert('pageAlert', 'Plan created', true); load();
      } catch (err) { showAlert('pageAlert', err.message); }
    }
    async function createTrainer() {
      try {
        await api('/trainers', { method: 'POST', body: JSON.stringify({
          name: document.getElementById('tName').value,
          email: document.getElementById('tEmail').value,
          password: document.getElementById('tPassword').value,
          specialization: document.getElementById('tSpec').value
        })});
        showAlert('pageAlert', 'Trainer created', true); load();
      } catch (err) { showAlert('pageAlert', err.message); }
    }
    async function createClass() {
      try {
        await api('/classes', { method: 'POST', body: JSON.stringify({
          title: document.getElementById('cTitle').value,
          trainerId: document.getElementById('cTrainer').value,
          capacity: Number(document.getElementById('cCapacity').value),
          startTime: new Date(document.getElementById('cStart').value).toISOString(),
          endTime: new Date(document.getElementById('cEnd').value).toISOString()
        })});
        showAlert('pageAlert', 'Class created', true); load();
      } catch (err) { showAlert('pageAlert', err.message); }
    }
    async function loadAttendance() {
      const res = await api('/admin/reports/attendance');
      document.getElementById('attReport').textContent = JSON.stringify(res.data, null, 2);
    }
    async function loadMemberships() {
      const res = await api('/admin/reports/memberships');
      document.getElementById('memReport').textContent = JSON.stringify(res.data, null, 2);
    }
    load().catch((err) => showAlert('pageAlert', err.message));
  </script>
</body>
</html>
