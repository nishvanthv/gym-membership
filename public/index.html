<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gym Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Gym Management System</span>
    </div>
  </nav>
  <div class="container" style="max-width: 920px;">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-4">
          <h4>Login</h4>
          <div id="loginAlert" class="alert alert-custom"></div>
          <form id="loginForm">
            <input class="form-control mb-2" name="email" type="email" placeholder="Email" required />
            <input class="form-control mb-3" name="password" type="password" placeholder="Password" required />
            <button class="btn btn-success w-100">Login</button>
          </form>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-4">
          <h4>Member Registration</h4>
          <div id="regAlert" class="alert alert-custom"></div>
          <form id="registerForm">
            <input class="form-control mb-2" name="name" placeholder="Full name" required />
            <input class="form-control mb-2" name="email" type="email" placeholder="Email" required />
            <input class="form-control mb-2" name="password" type="password" placeholder="Password (min 8 chars)" required />
            <select class="form-select mb-3" name="branchId" id="branchSelect"></select>
            <button class="btn btn-outline-success w-100">Register</button>
          </form>
        </div>
      </div>
    </div>
    <p class="mt-4 text-secondary">Demo accounts after <code>npm run seed</code>: admin@gym.local / Admin@123, trainer@gym.local / Trainer@123, member@gym.local / Member@123</p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function loadBranches() {
      const res = await api('/branches');
      const select = document.getElementById('branchSelect');
      select.innerHTML = res.data.map((b) => `<option value="${b._id}">${b.name}</option>`).join('');
    }

    function redirectByRole(user) {
      if (user.role === 'BRANCH_ADMIN') window.location.href = '/admin.html';
      else if (user.role === 'TRAINER') window.location.href = '/trainer.html';
      else window.location.href = '/member.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      try {
        const res = await api('/auth/login', { method: 'POST', body: JSON.stringify(data) });
        setSession(res.data.token, res.data.user);
        redirectByRole(res.data.user);
      } catch (err) {
        showAlert('loginAlert', err.message);
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      try {
        const res = await api('/auth/register', { method: 'POST', body: JSON.stringify(data) });
        setSession(res.data.token, res.data.user);
        redirectByRole(res.data.user);
      } catch (err) {
        showAlert('regAlert', err.message);
      }
    });

    loadBranches().catch(() => {
      // The server can still assign the first active branch when branch loading is unavailable.
    });
  </script>
</body>
</html>
